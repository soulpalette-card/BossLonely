<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>天道观察者 · 青云宗</title>
<style>
  :root{
    --ink:#0b0e13; --ink2:#141a24; --paper:#e9e0cc;
    --gold:#d9b25a; --gold2:#f0d998; --jade:#7fb2a0; --seal:#b0392e; --seal2:#c85347;
    --line:rgba(217,178,90,.28); --muted:#9aa3ad;
    --up:#8fd6a8; --down:#d98a8a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"STKaiti","KaiTi","楷体","STSong","SimSun",serif;
    color:var(--paper);
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(217,178,90,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(127,178,160,.10), transparent 55%),
      linear-gradient(160deg,#090c11,#141a24 60%,#090c11);
    background-attachment:fixed;
    overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
    background:
      radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.04), transparent),
      radial-gradient(2px 2px at 70% 80%, rgba(255,255,255,.03), transparent),
      repeating-linear-gradient(115deg, rgba(0,0,0,.10) 0 2px, transparent 2px 6px);
    mix-blend-mode:soft-light;
  }
  #app{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:10px 12px 96px;}

  header{text-align:center;padding:4px 0 8px;position:relative;}
  .title{
    font-size:26px;font-weight:700;letter-spacing:3px;
    background:linear-gradient(180deg,var(--gold2),var(--gold));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    display:inline-flex;align-items:center;gap:8px;
  }
  .seal{
    display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;
    background:linear-gradient(145deg,var(--seal2),var(--seal));color:#fff;font-size:14px;
    box-shadow:0 0 0 2px rgba(255,255,255,.15) inset,0 4px 12px rgba(176,57,46,.4);
    transform:rotate(-6deg);
  }
  .subtitle{color:var(--muted);font-size:12px;letter-spacing:2px;margin-top:2px;}

  /* 状态条 */
  .statbar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 6px;}
  .chip{
    background:rgba(20,26,36,.8);border:1px solid var(--line);border-radius:20px;
    padding:4px 10px;font-size:12px;color:var(--paper);display:flex;gap:5px;align-items:center;
  }
  .chip b{color:var(--gold2);font-weight:600;}
  .chip .lbl{color:var(--muted);}

  /* 时间控制 */
  .timebar{display:flex;gap:6px;align-items:center;justify-content:center;margin:6px 0 10px;flex-wrap:wrap;}
  .yearpill{
    background:linear-gradient(145deg,#1b2330,#12181f);border:1px solid var(--line);
    border-radius:8px;padding:5px 12px;font-size:14px;color:var(--gold2);letter-spacing:1px;
  }
  button{
    font-family:inherit;cursor:pointer;border-radius:8px;color:var(--paper);
    background:rgba(30,38,50,.9);border:1px solid var(--line);padding:6px 12px;font-size:13px;transition:.12s;
  }
  button:hover{border-color:var(--gold);color:var(--gold2);}
  button.active{background:linear-gradient(145deg,var(--gold),#b8923f);color:#1a1206;border-color:var(--gold2);font-weight:600;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  .btn-place{
    background:linear-gradient(145deg,var(--seal2),var(--seal));color:#fff;font-weight:600;
    border-color:var(--seal2);padding:8px 16px;font-size:14px;letter-spacing:1px;
  }
  .btn-place:hover{color:#fff;border-color:var(--gold2);}

  /* 卡片 */
  .card{
    background:linear-gradient(160deg,rgba(22,28,38,.92),rgba(14,18,25,.92));
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;
  }
  .card h3{margin:0 0 8px;font-size:15px;color:var(--gold2);letter-spacing:1px;display:flex;align-items:center;gap:6px;}
  .divider{height:1px;background:var(--line);margin:8px 0;}

  /* 年报 */
  .report{white-space:normal;line-height:1.7;font-size:13.5px;}
  .report .rp-head{text-align:center;color:var(--gold2);letter-spacing:2px;margin-bottom:6px;font-size:14px;}
  .report .tag{color:var(--jade);font-weight:600;}
  .report .tag-big{color:var(--gold2);font-weight:600;}
  .report .tag-die{color:var(--down);font-weight:600;}
  .report .stu{color:var(--gold2);}
  .report .rel-up{color:var(--up);font-size:12px;}
  .report .rel-dn{color:var(--down);font-size:12px;}
  .report .yline{margin:2px 0;}
  .report .indent{padding-left:14px;color:#cdd3da;}
  .muted{color:var(--muted);}
  .small{font-size:12px;}

  /* 名录 */
  .roster-item{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid rgba(217,178,90,.12);cursor:pointer;}
  .roster-item:hover{background:rgba(217,178,90,.06);}
  .avatar{
    width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:15px;flex:0 0 auto;
    background:linear-gradient(145deg,#20303a,#16202a);border:1px solid var(--line);
  }
  .avatar.player{border-color:var(--seal);box-shadow:0 0 0 1px var(--seal);}
  .ri-main{flex:1;min-width:0;}
  .ri-name{font-size:14px;color:var(--paper);}
  .ri-name .star{color:var(--seal2);}
  .ri-sub{font-size:11.5px;color:var(--muted);}
  .ri-realm{font-size:12px;color:var(--jade);text-align:right;flex:0 0 auto;}

  /* 弹窗 */
  .overlay{position:fixed;inset:0;background:rgba(4,6,9,.72);z-index:50;display:none;align-items:center;justify-content:center;padding:12px;}
  .overlay.show{display:flex;}
  .modal{
    background:linear-gradient(165deg,#161d27,#0d1219);border:1px solid var(--line);border-radius:14px;
    width:100%;max-width:560px;max-height:90vh;overflow-y:auto;padding:16px;position:relative;
  }
  .modal h2{margin:0 0 4px;font-size:19px;color:var(--gold2);letter-spacing:2px;}
  .modal .close{position:absolute;top:10px;right:12px;background:none;border:none;font-size:20px;color:var(--muted);padding:0;width:28px;}
  .modal .close:hover{color:var(--seal2);}

  .field{margin:10px 0;}
  .field label{display:block;font-size:13px;color:var(--gold2);margin-bottom:5px;letter-spacing:1px;}
  input[type=text],textarea{
    width:100%;background:rgba(10,14,20,.9);border:1px solid var(--line);border-radius:8px;
    color:var(--paper);font-family:inherit;font-size:14px;padding:8px 10px;
  }
  textarea{resize:vertical;min-height:52px;}
  .tpl-grid,.root-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
  .opt{
    background:rgba(12,17,24,.9);border:1px solid var(--line);border-radius:8px;padding:7px 6px;
    font-size:12px;text-align:center;cursor:pointer;line-height:1.35;
  }
  .opt:hover{border-color:var(--gold);}
  .opt.sel{background:linear-gradient(145deg,rgba(217,178,90,.22),rgba(217,178,90,.08));border-color:var(--gold2);}
  .opt .on{color:var(--gold2);font-weight:600;display:block;}
  .opt .om{color:var(--muted);font-size:10.5px;}

  .attr-row{display:flex;align-items:center;gap:8px;margin:7px 0;}
  .attr-row .an{width:64px;font-size:13px;color:var(--paper);}
  .attr-row .ac{width:44px;font-size:11px;color:var(--muted);text-align:right;}
  .attr-row input[type=range]{flex:1;accent-color:var(--gold);}
  .attr-row .av{width:22px;text-align:center;color:var(--gold2);font-size:14px;}
  .budget{font-size:14px;text-align:center;margin:6px 0;}
  .budget b{color:var(--gold2);}
  .budget.over b{color:var(--down);}

  .step-nav{display:flex;justify-content:space-between;gap:8px;margin-top:14px;}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:4px;}

  /* 九殿点亮 */
  .halls{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;}
  .hall{
    border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;display:flex;
    justify-content:space-between;align-items:center;background:rgba(10,14,20,.5);
  }
  .hall.lit{background:linear-gradient(145deg,rgba(217,178,90,.16),rgba(217,178,90,.04));border-color:var(--gold2);}
  .hall .hn{color:var(--paper);}
  .hall.lit .hn{color:var(--gold2);}
  .hall .hs{font-size:10.5px;color:var(--muted);}

  /* 详情 */
  .detail-attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0;}
  .da{background:rgba(10,14,20,.6);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;}
  .da .dn{font-size:11px;color:var(--muted);}
  .da .dv{font-size:16px;color:var(--gold2);}
  .rel-item{font-size:12.5px;padding:4px 0;border-bottom:1px solid rgba(217,178,90,.1);}
  .chron{font-size:12.5px;line-height:1.6;color:#cdd3da;padding:2px 0;}

  /* 底栏 */
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:linear-gradient(0deg,#0a0d12,rgba(10,13,18,.92));border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:6px 4px;max-width:600px;margin:0 auto;
  }
  nav button{background:none;border:none;color:var(--muted);font-size:11px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;}
  nav button .ic{font-size:17px;}
  nav button.active{color:var(--gold2);}
  .page{display:none;}
  .page.show{display:block;}

  .toast{
    position:fixed;left:50%;bottom:78px;transform:translateX(-50%);z-index:60;
    background:rgba(15,20,28,.96);border:1px solid var(--gold);border-radius:10px;
    padding:8px 16px;font-size:13px;color:var(--gold2);opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center;
  }
  .toast.show{opacity:1;}
  .empty{color:var(--muted);text-align:center;padding:20px;font-size:13px;line-height:1.7;}
  .badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:10px;border:1px solid var(--line);color:var(--jade);margin-left:4px;}
  .flag{color:var(--seal2);}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title"><span class="seal">道</span>天道观察者</div>
    <div class="subtitle">青云宗 · 从四十七人的弱宗开始</div>
  </header>

  <div class="statbar" id="statbar"></div>

  <div class="timebar">
    <div class="yearpill" id="yearpill">宗门历 421 年</div>
    <button data-spd="0">暂停</button>
    <button data-spd="1" class="active">观流年</button>
    <button data-spd="2">快进</button>
    <button id="btn-year">推演一年 ▸</button>
  </div>

  <div style="text-align:center;margin-bottom:8px;">
    <button class="btn-place" id="btn-place">✦ 投放一名弟子 ✦</button>
  </div>

  <div class="page show" id="page-report"><div id="report-list"></div></div>

  <div class="page" id="page-sect">
    <div class="card" id="sect-overview"></div>
    <div class="card"><h3>◈ 祖制复兴 · 九殿一阁</h3><div class="halls" id="halls"></div></div>
    <div class="card" id="sect-threat"></div>
  </div>

  <div class="page" id="page-roster">
    <div class="card"><h3>◈ 宗门名录 <span class="small muted" id="roster-count"></span></h3><div id="roster-list"></div></div>
  </div>

  <div class="page" id="page-hall">
    <div class="card"><h3>◈ 传记馆</h3><div class="hint">凡逝去、离宗、飞升者，天道为其立传。</div><div id="hall-list"></div></div>
  </div>

  <div class="page" id="page-history">
    <div class="card"><h3>◈ 青云宗史书</h3><div id="history-list"></div></div>
    <div class="card"><h3>◈ 功德 · 天道所积</h3><div id="merit-panel"></div></div>
    <div class="card">
      <h3>◈ 设置</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button id="btn-export">导出存档</button>
        <button id="btn-import">导入存档</button>
        <button id="btn-reset">重开新纪元</button>
      </div>
      <div class="hint" style="margin-top:8px;">现实 1 小时 ＝ 游戏 1 年。玩家扮演天道，唯一操作是投放弟子，不能干预其命运——只能观察，只能记录。</div>
    </div>
  </div>
</div>

<nav id="nav">
  <button data-page="report" class="active"><span class="ic">📜</span>年报</button>
  <button data-page="sect"><span class="ic">⛩</span>宗门</button>
  <button data-page="roster"><span class="ic">👥</span>名录</button>
  <button data-page="hall"><span class="ic">🏛</span>传记</button>
  <button data-page="history"><span class="ic">📖</span>史书</button>
</nav>

<div class="overlay" id="create-overlay"><div class="modal" id="create-modal"></div></div>
<div class="overlay" id="detail-overlay"><div class="modal" id="detail-modal"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================================
   天道观察者 · 青云宗   —— 修仙宗门放置游戏（M1+ 可玩切片）
   单文件 · 零依赖。玩家扮演天道，唯一操作是投放弟子，逐年模拟观察宗门兴衰。
   ============================================================================ */

/* ---------- 通用工具 ---------- */
const $ = s => document.querySelector(s);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const pick = a => a[Math.floor(Math.random()*a.length)];
const chance = p => Math.random() < p;
const rint = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
let _uid = 1; const uid = ()=> 'c'+(_uid++);

/* ---------- 静态数据 ---------- */
const REALMS = ['练气','筑基','金丹','元婴','化神','飞升'];
const REALM_LIFESPAN = {'练气':120,'筑基':250,'金丹':500,'元婴':1200,'化神':3000,'飞升':99999,'凡人':60};
const QI_LAYERS = ['一层','二层','三层','四层','五层','六层','七层','八层','九层'];
const SUB_STAGES = ['初期','中期','后期','圆满'];
const STAGE_NAMES = ['风雨飘摇','站稳脚跟','中兴','崛起','鼎盛'];
const STAGE_TIER = ['五流','四流','三流','二流','一流'];

const ELEMENTS = [
  {k:'金',dept:'剑修/守山'},{k:'木',dept:'药园/灵田/医'},{k:'水',dept:'医/灵田'},
  {k:'火',dept:'丹房/锻器'},{k:'土',dept:'阵法/营造'}
];
const ROOT_INFO = {
  1:{name:'天灵根',cost:2.0,speed:1.5}, 2:{name:'真灵根',cost:1.5,speed:1.2},
  3:{name:'上灵根',cost:1.2,speed:1.0}, 4:{name:'下灵根',cost:1.0,speed:0.85},
  5:{name:'杂灵根',cost:0.7,speed:0.7}
};
const ATTRS = [
  {k:'purity', n:'灵根纯度', cost:3, rollable:true},
  {k:'insight',n:'悟性',     cost:3, rollable:true},
  {k:'heart',  n:'心性',     cost:2, rollable:true},
  {k:'body',   n:'体魄',     cost:2, rollable:true},
  {k:'luck',   n:'气运',     cost:4, rollable:false},
  {k:'charm',  n:'魅力',     cost:1, rollable:true}
];
const TEMPLATES = [
  {k:'孤儿',   mod:{heart:1,charm:-1}, vis:-1, item:'', hook:'身世之谜'},
  {k:'农家子', mod:{body:1,insight:-1}, item:'干粮', hook:'灵田药园考评+1'},
  {k:'猎户之子',mod:{body:1,heart:1,insight:-1,charm:-1}, item:'好弓', hook:'山林直觉'},
  {k:'商贾之子',mod:{charm:1,heart:-1}, item:'50灵石', stone:50, hook:'坊市亲和'},
  {k:'书香门第',mod:{insight:1,body:-1}, item:'一箱书', hook:'藏经阁抄书亲和'},
  {k:'世家旁支',mod:{insight:1,charm:1,body:-1}, item:'护身玉佩', hook:'家族因果'},
  {k:'将门之后',mod:{body:1,charm:1,insight:-1,heart:-1}, item:'枪谱残页', hook:'大比增益·仇家链'},
  {k:'山野道童',mod:{heart:2,charm:-1,insight:-1}, vis:1, item:'破旧道经', hook:'师承之谜'},
  {k:'渔家子', mod:{body:1}, item:'鱼刀', hook:'水属性增益'},
  {k:'流民',   mod:{heart:-1,body:-1,luck:1}, vis:-1, item:'', hook:'绝处逢生'},
  {k:'药铺学徒',mod:{insight:1,heart:1,purity:-1}, item:'凡药一包', hook:'丹霞线考评+1'},
  {k:'落魄贵族',mod:{charm:2,heart:-1,body:-1}, item:'凡铁祖剑', hook:'复兴门楣执念'}
];
const PERSONALITIES = ['坚忍','洒脱','孤傲','谦和','贪杯','执拗','机敏','木讷','热忱','阴沉','侠气','算计','痴心','淡泊','好胜','忠厚','狡黠','刚烈','慵懒','清高'];
const HOBBIES = ['嗜酒','爱剑','贪吃','好棋','痴丹','恋花','惧水','喜静','逐名','恋旧','养兽','拾荒'];
const CONSTITUTIONS = ['剑心通明','纯阳之体','纯阴之体','药鼎之体','战体','琉璃道心','食铁兽','蜀山剑骨'];
const FATES = ['血仇之子','封印在身','魔道内应之子','转世残魂','墨渊余孽'];
const VARIANTS = ['雷','冰','风','岩浆','晶'];
const SURNAMES = '赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨朱秦尤许何吕施张孔曹严华金魏陶姜戚谢邹喻柏水窦章云苏潘葛范彭郎鲁韦昌马苗凤花方俞任袁柳唐罗薛雷贺倪汤滕殷罗毕郝邬安常乐于时傅卞齐康伍余元卜顾孟平黄穆萧尹';
const GIVEN = '云山川河星月松竹梅兰霜雪风雷海墨白青玄清远志航行知逸尘寒烟落极守一问天听雨观澜怀瑾握瑜承继光明若谷长歌未晞衿修尚武轩铭意致博彦霖';

/* ---------- 具名 NPC 工厂 ---------- */
function makeNamed(name, role, realm, sub, layer, pers, post, age, opts={}){
  return Object.assign({
    id:uid(), name, isPlayer:false, named:true, role,
    realm, subIndex:sub, qiLayer:layer||0,
    template:null, rootElems:[], rootName:'—', variant:null, potential:null,
    detected:{}, actual:{purity:5,insight:5,heart:5,body:5,luck:5,charm:5},
    level:opts.level||'长老', post, age,
    lifespan:Math.round(REALM_LIFESPAN[realm]*(0.9+Math.random()*0.2)),
    cult:0, alive:true, status:'在宗',
    personality:[pers], hobbies:[], constitution:opts.con||null, fate:null,
    rel:{}, chron:[], joinYear:421-age+10, mood:0, vis:0
  }, opts.extra||{});
}

/* ---------- 全局状态 ---------- */
let S = null;

function freshState(){
  _uid = 1;
  const named = [
    makeNamed('青阳真人','老祖','元婴',3,0,'淡泊','护山大阵·阵眼',612,{level:'老祖',extra:{sleeping:true,status:'沉睡'}}),
    makeNamed('玄诚子','掌门','金丹',1,0,'坚忍','掌门·传功·收徒',214,{level:'掌门',extra:{oldWound:true}}),
    makeNamed('厉秋霜','执法长老','筑基',3,0,'刚烈','执法·守山·巡山',98,{level:'长老'}),
    makeNamed('胡青囊','丹医长老','筑基',2,0,'贪杯','炼丹·医馆·药园',121,{level:'长老'}),
    makeNamed('陈守拙','内务执事','筑基',1,0,'忠厚','事务·库房·藏经阁·账房',89,{level:'执事'}),
    makeNamed('顾长风','大师兄','筑基',2,0,'谦和','战力·代课·押运',46,{level:'真传'}),

let draft = null;
function newDraft(){ return { step:1, name:'', bg:'', template:null, elems:[], alloc:{purity:0,insight:0,heart:0,body:0,luck:0,charm:0} }; }
function rootCoef(){ return ROOT_INFO[draft.elems.length || 3]; }
function attrCost(k){
  const base = ATTRS.find(a=>a.k===k).cost;
  if(k==='purity') return Math.round(base * rootCoef().cost * 10)/10;
  return base;
}
function budgetSpent(){ let s=0; for(const k in draft.alloc) s+=draft.alloc[k]*attrCost(k); return Math.round(s); }
function budgetLeft(){ return S.unlocks.budget - budgetSpent(); }

function openCreate(){
  if(S.endState){ toast('宗门大势已定，天道不再落子。'); return; }
  draft = newDraft();
  $('#create-overlay').classList.add('show');
  renderCreate();
}
function closeCreate(){ $('#create-overlay').classList.remove('show'); draft=null; }

function renderCreate(){
  const m = $('#create-modal');
  let h = `<button class="close" onclick="closeCreate()">×</button>`;
  h += `<h2>投放新弟子 · 第 ${draft.step}/5 步</h2>`;

    h += `<div class="field"><label>取名</label>

    h += `<div class="field"><label>自由背景（≤200字，可选）</label>
      <textarea id="in-bg" maxlength="200" placeholder="一段来历。系统会据此提炼一个性格标签供你确认——这是你影响其心性的唯一通道。">${draft.bg}</textarea></div>`;
  } else if(draft.step===2){
    h += `<div class="field"><label>选出身模板（12选1 · 各有得失）</label><div class="tpl-grid">`;
    TEMPLATES.forEach((t,i)=>{
      const mods = Object.entries(t.mod).map(([k,v])=>`${ATTRS.find(a=>a.k===k).n}${v>0?'+'+v:v}`).join(' ');
      h += `<div class="opt ${draft.template===i?'sel':''}" onclick="selTpl(${i})"><span class="on">${t.k}</span><span class="om">${mods}</span></div>`;
    });
    h += `</div>`;
    if(draft.template!=null){ const t=TEMPLATES[draft.template]; h += `<div class="hint">携带：${t.item||'无'}　·　钩子：${t.hook}</div>`; }
  } else if(draft.step===3){
    h += `<div class="field"><label>选灵根构成（五行选 1–5 种）</label><div class="root-grid">`;
    ELEMENTS.forEach(e=>{ const sel=draft.elems.includes(e.k); h += `<div class="opt ${sel?'sel':''}" onclick="toggleElem('${e.k}')"><span class="on">${e.k}</span><span class="om">${e.dept}</span></div>`; });
    h += `</div>`;
    const n = draft.elems.length;
    if(n){ const info=ROOT_INFO[n]; h += `<div class="hint">${n}灵根 · <b class="stu">${info.name}</b>　纯度成本×${info.cost}　修炼速度×${info.speed}${n===1?'　（天灵根必被围观，恐遭大宗惦记）':''}</div>`; }
    else h += `<div class="hint">未选则默认三灵根（上灵根）。</div>`;
  } else if(draft.step===4){
    h += `<div class="budget ${budgetLeft()<0?'over':''}">潜力预算：<b>${budgetLeft()}</b> / ${S.unlocks.budget}</div>`;
    ATTRS.forEach(a=>{
      const v = 1 + draft.alloc[a.k];
      h += `<div class="attr-row"><span class="an">${a.n}</span>

        <span class="av">${v}</span><span class="ac">×${attrCost(a.k)}</span></div>`;
    });
    h += `<div class="hint">基础值 1 免费，上限 10。购买的是<b>潜力</b>——投放瞬间会 roll 出无人可见的<b>实际值</b>，宗门再测出带误差的<b>检测值</b>。三者不等，落差即故事。（气运例外：所见即所得，故最贵。）</div>`;
  } else if(draft.step===5){
    const t = TEMPLATES[draft.template];
    const rn = draft.elems.length?ROOT_INFO[draft.elems.length].name:'上灵根';
    h += `<div class="card" style="margin:8px 0;">
      <div style="font-size:16px;color:var(--gold2);">${draft.name||'（无名）'}</div>
      <div class="small muted">${t.k} · ${draft.elems.join('')||'金木水'}灵根（${rn}）</div>
      <div class="detail-attrs" style="margin-top:8px;">`;
    ATTRS.forEach(a=>{ const v=clamp(1+draft.alloc[a.k]+(t.mod[a.k]||0),1,10); h += `<div class="da"><div class="dn">${a.n}</div><div class="dv">${v}</div></div>`; });
    h += `</div><div class="hint">上表为<b>潜力值</b>（含出身修正）。确认后即行投放，命运自此不受你左右。</div></div>`;

  h += `<div class="step-nav">`;

  h += `</div>`;
  m.innerHTML = h;
}

window.selTpl = i => { draft.template=i; renderCreate(); };
window.toggleElem = k => {
  const i = draft.elems.indexOf(k);
  if(i>=0) draft.elems.splice(i,1);
  else if(draft.elems.length<5) draft.elems.push(k);
  renderCreate();
};
window.setAlloc = (k,v)=>{ const nv=parseInt(v), old=draft.alloc[k]; draft.alloc[k]=nv; if(budgetSpent()>S.unlocks.budget) draft.alloc[k]=old; renderCreate(); };
window.stepPrev = ()=>{ draft.step--; renderCreate(); };
window.stepNext = ()=>{
  if(draft.step===1){ draft.name=($('#in-name').value||'').trim(); draft.bg=($('#in-bg').value||'').trim(); if(!draft.name){ toast('请为弟子取名'); return; } }

};
window.confirmPlace = ()=>{
  const c = buildCharacter(draft);

  S.characters.push(c);

};

/* ---------- 三层数值 ---------- */
function rollActual(pot){
  const r = Math.random();
  let v = pot;
  if(r<0.40) v=pot; else if(r<0.60) v=pot+1; else if(r<0.80) v=pot-1; else if(r<0.90) v=pot+2; else v=pot-2;
  return clamp(v,1,10);
}
function testValue(actual, stage){ const maxErr = stage<=1?1:2; return clamp(actual+rint(-maxErr,maxErr),1,10); }

function buildCharacter(d){
  const t = TEMPLATES[d.template];
  const elems = d.elems.length?d.elems.slice():['金','木','水'];
  const potential={}, actual={};
  ATTRS.forEach(a=>{
    const pot = clamp(1 + d.alloc[a.k] + (t.mod[a.k]||0), 1, 10);
    potential[a.k]=pot;
    actual[a.k] = a.rollable ? rollActual(pot) : pot;
  });
  const pers=[]; const bgTag=extractTag(d.bg);
  if(bgTag) pers.push(bgTag);
  pers.push(pick(PERSONALITIES));
  if(chance(.6)) pers.push(pick(PERSONALITIES));
  const hobbies=[pick(HOBBIES)]; if(chance(.5)) hobbies.push(pick(HOBBIES));
  return {
    id:uid(), name:d.name, isPlayer:true, named:false, role:null,
    template:t.k, rootElems:elems, rootName:ROOT_INFO[elems.length].name,
    variant: chance(0.02)?pick(VARIANTS):null, bg:d.bg,
    potential, actual, detected:{},
    realm:'练气', subIndex:0, qiLayer:0,
    level:'门下', post:'待分配', age:rint(12,17),
    lifespan:Math.round(REALM_LIFESPAN['练气']*(0.9+Math.random()*0.2)),
    cult:0, alive:true, status:'新入门',
    personality:[...new Set(pers)], hobbies,
    constitution: chance(0.03)?pick(CONSTITUTIONS):null,
    fate: chance(0.10)?pick(FATES):null,
    rel:{}, chron:[], joinYear:S.year, mood:0, vis:(t.vis||0), stone:t.stone||0
  };
}
function extractTag(bg){
  if(!bg) return null;
  for(const p of PERSONALITIES){ if(bg.includes(p)) return p; }
  if(/剑/.test(bg)) return '好胜';
  if(/仇|恨|血/.test(bg)) return '刚烈';
  if(/书|学|文/.test(bg)) return '谦和';
  if(/酒/.test(bg)) return '洒脱';
  if(/穷|苦|难|孤/.test(bg)) return '坚忍';
  return null;
}

/* ---------- 入门：测灵根 + 定级分岗 ---------- */
function inductCharacter(c){
  c.detected.purity = testValue(c.actual.purity, S.stage);
  c.detected.insight= testValue(c.actual.insight, S.stage);
  c.detected.body   = clamp(c.actual.body + rint(-1,1),1,10);
  c.detected.charm  = clamp(c.actual.charm + rint(-1,1),1,10);
  const visRoll = c.actual.luck + c.vis + (S.stage<=1?3:0);
  const noticed = visRoll > rint(0,4);
  const conBonus = c.constitution?2:0;
  const base = c.detected.purity*2 + c.detected.insight + c.vis + conBonus;
  let level, post;
  if(S.stage<=1){
    if(base>=14){ level='门下'; post=assignPost(c); } else { level='杂役'; post=pick(['膳堂帮工','净役','洒扫','药园杂役']); }
  } else {
    if(base>=28){ level='真传'; post=assignPost(c); }
    else if(base>=22){ level='内门'; post=assignPost(c); }
    else if(base>=14){ level='外门'; post=assignPost(c); }
    else if(base>=8){ level='记名'; post='旁听末排'; }
    else { level='杂役'; post=pick(['膳堂帮工','净役','洒扫']); }
  }
  c.level=level; c.post=post;
  const master = S.characters.find(x=>x.level==='掌门'&&x.alive);
  const mn = master?master.name:'掌门';
  const rootStr = c.rootElems.join('');
  let text;
  if(!noticed && S.stage>=2){
    text = `新入门弟子${c.name}默默办了入门手续，无人多看一眼。（${level}·${post}）`;
  } else if(S.stage<=1){
    text = `${mn}亲执上品测灵石为${c.name}测灵根：${rootStr}灵根（${c.rootName}），验作<span class="stu">${level}</span>，分往${post}。`;
  } else {
    text = `收徒大典，${c.name}入门，测得${c.rootName}，定为${level}，分往${post}。`;
  }
  if(c.constitution && chance(.5)) text += ` （测灵石隐隐震颤，执事却未解其意。）`;
  logHistory(text.replace(/<[^>]+>/g,''));
  seedRelations(c);
}
function assignPost(c){
  const aff = {'火':['丹房帮工','锻器学徒'],'木':['药园帮工','灵田耕作','医棚学徒'],'水':['医棚学徒','灵田耕作'],'金':['守山巡哨','剑课旁听'],'土':['阵眼洒扫','营造帮工']};
  let pool=[];
  c.rootElems.forEach(e=>{ if(aff[e]) pool=pool.concat(aff[e]); });
  if(c.template==='药铺学徒'||c.template==='农家子') pool.push('药园帮工');
  return pool.length?pick(pool):'杂务';
}
function seedRelations(c){
  const mentors = S.characters.filter(x=>x.named && x.alive && x.id!==c.id);
  let mentor=null;
  if(c.rootElems.includes('火')||c.template==='药铺学徒') mentor=mentors.find(m=>m.name==='胡青囊');
  else if(c.rootElems.includes('金')) mentor=mentors.find(m=>m.name==='顾长风');
  if(mentor && chance(.5)) setRel(c,mentor,10,'引路人');
  if(c.level==='杂役'){ const wei=mentors.find(m=>m.name==='老魏'); if(wei&&chance(.6)) setRel(c,wei,8,'引路人'); }
}

/* ---------- 关系 ---------- */
function setRel(a,b,delta,type){
  if(!a.rel[b.id]) a.rel[b.id]={v:0,type:null};
  if(!b.rel[a.id]) b.rel[a.id]={v:0,type:null};
  a.rel[b.id].v = clamp(a.rel[b.id].v+delta,-100,100);
  b.rel[a.id].v = clamp(b.rel[a.id].v+delta,-100,100);
  if(type){ a.rel[b.id].type=type; b.rel[a.id].type=type; }
}
function relName(v){
  if(v>=70)return '挚友'; if(v>=30)return '交好'; if(v>=10)return '相识';
  if(v<=-70)return '死敌'; if(v<=-30)return '仇怨'; if(v<=-10)return '不睦';
  return '泛泛';
}

/* ============================================================================
   模拟引擎 —— 逐年推演
   ============================================================================ */
function realmRank(c){ return REALMS.indexOf(c.realm); }
function power(c){
  const base = {'凡人':0.2,'练气':1,'筑基':8,'金丹':40,'元婴':200,'化神':1000,'飞升':5000}[c.realm]||1;
  const lv = {'真传':1.4,'掌门':2,'长老':1.6,'老祖':4,'内门':1,'外门':0.7,'记名':0.5,'杂役':0.3,'执事':1.1,'门下':0.8,'雇工':0.1}[c.level]||1;
  const layer = c.realm==='练气'?(1+c.qiLayer*0.1):(1+c.subIndex*0.2);
  return base*lv*layer;
}
function sectPower(){ return S.characters.filter(c=>c.alive).reduce((s,c)=>s+power(c),0); }
function peopleCount(){ return S.characters.filter(c=>c.alive).length; }
function realmLabel(c){
  if(c.realm==='凡人') return '凡人';
  if(c.realm==='练气') return '练气'+QI_LAYERS[c.qiLayer];
  if(c.realm==='飞升') return '已飞升';
  return c.realm+SUB_STAGES[c.subIndex];
}

function simulateYear(){
  const yearNews = [];
  const spot = [];
  S.year++;
  const spotlightIds = getSpotlightIds();

  for(const c of S.characters){
    if(!c.alive || c.sleeping) continue;
    c.age++;
    const evs = [];
    advanceCultivation(c, evs);
    rollEvents(c, evs, yearNews);
    tryBreakthrough(c, evs, yearNews);
    if(c.alive && c.age >= c.lifespan){ deathOf(c, '寿元耗尽，无疾而终', yearNews); continue; }
    if(c.alive && (c.isPlayer || c.named || spotlightIds.has(c.id)) && evs.length) spot.push({c, evs});
  }

  evolveRelations();
  sectStateMachine(yearNews);
  populationDrift(yearNews);
  buildAnnualReport(yearNews, spot);
}

function getSpotlightIds(){
  const ids = new Set();
  S.characters.filter(c=>c.alive && c.isPlayer).forEach(p=>{
    ids.add(p.id);
    for(const rid in p.rel){ if(Math.abs(p.rel[rid].v)>=10) ids.add(rid); }
  });
  return ids;
}

function cultNeed(c){ return c.realm==='练气' ? 6 : (10 + c.subIndex*4); }
function advanceCultivation(c, evs){
  if(c.realm==='凡人') return;
  const a = c.actual;
  const rootSpeed = c.rootElems.length?ROOT_INFO[c.rootElems.length].speed:1;
  const variantMul = c.variant?1.3:1;
  const resource = {'真传':1.5,'掌门':1.6,'长老':1.5,'内门':1.1,'执事':1.2,'门下':1,'外门':0.85,'记名':0.7,'杂役':0.6,'老祖':1.6}[c.level]||1;
  const conMul = c.constitution?1.15:1;
  let g = (0.3 + a.purity*0.11 + a.insight*0.05) * rootSpeed * variantMul * resource * conMul * (0.75+Math.random()*0.5);
  if(c.status==='闭关') g*=1.4;
  if(c.status==='疗伤'){ g*=0.4; if(chance(.4)) c.status='在宗'; }
  if(c.oldWound) g*=0.7;
  c.cult += g;
  const need = cultNeed(c);
  while(c.realm==='练气' && c.qiLayer<8 && c.cult>=need){ c.cult-=need; c.qiLayer++; if(c.isPlayer||c.named) evs.push({t:'up',s:`修为精进至练气${QI_LAYERS[c.qiLayer]}`}); }
  if(c.realm!=='练气' && c.realm!=='飞升'){
    while(c.subIndex<3 && c.cult>=cultNeed(c)){ c.cult-=cultNeed(c); c.subIndex++; if(c.isPlayer||c.named) evs.push({t:'up',s:`境界稳固，臻至${c.realm}${SUB_STAGES[c.subIndex]}`}); }
  }
}

function tryBreakthrough(c, evs, news){
  if(c.realm==='凡人'||c.realm==='飞升') return;
  const atCap = (c.realm==='练气' && c.qiLayer>=8 && c.cult>=cultNeed(c)) || (c.realm!=='练气' && c.subIndex>=3 && c.cult>=cultNeed(c));
  if(!atCap) return;
  const a = c.actual;
  const hasDan = S.halls.find(h=>h.k==='丹霞殿').lit ? 0.06 : 0;
  let p = 0.04 + a.purity*0.028 + a.heart*0.028 + a.luck*0.03 + hasDan + S.stage*0.01;
  if(c.constitution) p+=0.06;
  const rr = realmRank(c);
  p = clamp(p, 0.02, 0.85) * ([1,0.75,0.45,0.22,0.1][rr]||0.05);
  if(!chance(p)){
    if(chance(0.12) && a.heart<5){ deathOf(c,'冲击境界走火入魔，心魔反噬而亡',news); }
    else if(chance(.3)){ c.status='疗伤'; if(c.isPlayer||c.named) evs.push({t:'dn',s:`冲击${REALMS[rr+1]}失败，经脉受损，闭门疗伤`}); }
    else if((c.isPlayer||c.named)&&chance(.3)) evs.push({t:'dn',s:'叩关未成，功败垂成'});
    return;
  }
  c.realm = REALMS[rr+1]; c.subIndex=0; c.qiLayer=0; c.cult=0;
  c.lifespan = Math.max(c.lifespan, c.age + Math.round(REALM_LIFESPAN[c.realm]*(0.85+Math.random()*0.3)));
  c.status='在宗';
  evs.push({t:'up', s:`突破大境界，晋入${c.realm}期`});
  news.push({imp:8, kind:'big', text:`${c.name}历${c.realm==='筑基'?'雷劫':'天劫'}洗礼，成功突破至<span class="stu">${c.realm}</span>！`});
  logHistory(`${c.name}突破至${c.realm}期。`);
  promoteByRealm(c, news);
  if(c.realm==='飞升') ascend(c, news);
}

function promoteByRealm(c, news){
  const old=c.level;
  if(c.isPlayer||!c.named){
    if(c.realm==='筑基' && ['门下','外门','内门','记名','杂役'].includes(c.level)) c.level='内门';
    if(c.realm==='金丹' && c.level!=='掌门') c.level='长老';
    if(c.realm==='元婴') c.level='老祖';
  }
  if(c.level!==old && (c.isPlayer||c.named)) news.push({imp:6, kind:'big', text:`${c.name}修为既成，宗门擢其为<span class="stu">${c.level}</span>。`});
}

function ascend(c, news){
  c.alive=false; c.status='已飞升';
  news.push({imp:10,kind:'big',text:`⟡ ${c.name}白日飞升，青云宗仙人碑上，又添一名。⟡`});
  archiveChar(c, '飞升', `于宗门历${S.year}年白日飞升，名入仙人碑。`);
  S.merit += 50;
  if(c.isPlayer && c.joinYear && c.template) grantAch('扫地僧');
}

/* ---------- 事件系统 ---------- */
function rollEvents(c, evs, news){
  const luck = c.actual.luck||5;
  const n = chance(0.5)?1:(chance(0.3)?2:0);
  for(let i=0;i<n;i++){ const ev=pick(pickEventPool(luck)); if(ev) ev(c, evs, news); if(!c.alive) break; }
}
function pickEventPool(luck){
  const r = Math.random();
  const goodBias = (luck-5)*0.03;
  if(r < 0.26+goodBias) return EV_FORTUNE;
  if(r < 0.74) return EV_DAILY;
  if(r < 0.85) return EV_CONFLICT;
  if(r < 0.93) return EV_ROMANCE;
  return EV_CRISIS;
}

  (c,e)=> { if(c.level==='杂役') e.push({t:'',s:pick(['膳堂切菜烧火，偷学一招半式','洒扫时听得满宗八卦','净役巡遍全宗，地形烂熟于心'])}); else e.push({t:'',s:'部门当值，兢兢业业'}); },
  (c,e)=> e.push({t:'',s:`与同门${pick(['论道','对弈','饮酒','切磋'])}，各有所得`}),
  (c,e)=> { c.cult+=1.2; e.push({t:'up',s:'偶有所悟，修为略进'}); },
];
const EV_FORTUNE = [

  (c,e,news)=>{ if(!c.constitution&&chance(.15)){ c.constitution=pick(CONSTITUTIONS); e.push({t:'up',s:`一场机缘中，隐藏体质<span class="stu">${c.constitution}</span>显现！`}); news.push({imp:6,kind:'big',text:`${c.name}身负异禀，${c.constitution}显世。`}); } else { c.cult+=2; e.push({t:'up',s:'机缘巧合，小有所获'}); } },
  (c,e)=>{ if(c.variant){ c.cult+=3; e.push({t:'up',s:`实战中${c.variant}属性异力初显，威能不凡`}); } else { S.spiritStones+=rint(20,80); e.push({t:'',s:'办差得力，获宗门赏赐灵石'}); } },
  (c,e)=>{ if(c.level==='杂役'&&chance(.4)){ const boss=pick(S.characters.filter(x=>x.named&&x.alive)); if(boss){ setRel(c,boss,12,'引路人'); e.push({t:'up',s:`办事伶俐，为${boss.name}所赏识`}); } } else e.push({t:'up',s:'时来运转，诸事顺遂'}); },
];
const EV_CONFLICT = [
  (c,e)=> e.push({t:'',s:pick(['与同门因分派争执，结下嫌隙','大比切磋落败，心有不甘','被纠察弟子刁难，忍气吞声'])}),
  (c,e)=>{ const others=S.characters.filter(x=>x.alive&&x.id!==c.id&&(x.isPlayer||x.named)); if(others.length){ const o=pick(others); if(chance(.5)){ setRel(c,o,-14,'仇怨'); e.push({t:'dn',s:`与${o.name}因${pick(['夺丹','争功','口角','旧怨'])}生隙`}); } else e.push({t:'',s:'门内摩擦，不欢而散'}); } else e.push({t:'',s:'心浮气躁，独自郁结'}); },
  (c,e)=>{ if(c.actual.body>=5){ c.cult+=2; e.push({t:'',s:'边界巡逻遇黑水寨蟊贼，力退之'}); } else { c.status='疗伤'; e.push({t:'dn',s:'外出办差遇袭负伤，归宗疗养'}); } },
];
const EV_ROMANCE = [
  (c,e,news)=>{ const others=S.characters.filter(x=>x.alive&&x.id!==c.id&&Math.abs((x.age||30)-c.age)<15); if(others.length&&c.age>16){ const o=pick(others); setRel(c,o,rint(8,18),'挚友'); e.push({t:'up',s:`与${o.name}日渐投契`}); if(chance(.15)&&c.age>18){ setRel(c,o,20,'道侣'); news.push({imp:5,kind:'',text:`${c.name}与${o.name}情投意合，结为道侣。`}); } } else e.push({t:'',s:'独来独往，道心澄明'}); },
  (c,e)=>{ const m=S.characters.find(x=>x.named&&x.alive&&x.id!==c.id); if(m){ setRel(c,m,rint(4,10),'师徒'); e.push({t:'up',s:`得${m.name}指点，感念在心`}); } },

const EV_CRISIS = [

  (c,e)=>{ e.push({t:'dn',s:pick(['心魔缠身，道心动摇','旧伤复发，修为倒退','卷入宗门纷争，思过崖面壁'])}); if(chance(.4)&&c.realm==='练气') c.qiLayer=Math.max(0,c.qiLayer-1); },
  (c,e)=>{ if(S.stage<=1) e.push({t:'dn',s:'月例又拖欠，囊中羞涩，苦捱度日'}); else e.push({t:'',s:'诸事平平，唯觉修行不易'}); },
];

function deathOf(c, reason, news){
  if(!c.alive) return;
  if(c.template==='世家旁支' && !c._jadeUsed){ c._jadeUsed=true; c.status='疗伤'; news.push({imp:4,kind:'',text:`${c.name}命悬一线，贴身护身玉佩碎裂，挡下这一劫。`}); return; }
  c.alive=false; c.status='身故'; c.deathYear=S.year;
  const important = c.isPlayer||c.named;
  news.push({imp:important?9:3, kind:'die', text:`${c.name}（${c.level}·${realmLabel(c)}）${reason}。年${c.age}。${peopleCount()<50?'全宗皆往吊唁。':''}`});
  logHistory(`${c.name}逝，年${c.age}，${reason}。`);
  archiveChar(c, '身故', `${reason}。享年${c.age}。`);
  if(c.level==='掌门'){ news.push({imp:10,kind:'big',text:`⚑ 掌门${c.name}羽化，青云宗陷入继承危机！`}); handleSuccession(news); }
}
function handleSuccession(news){
  const cand = S.characters.filter(c=>c.alive&&c.level==='真传').sort((a,b)=>power(b)-power(a))[0]
            || S.characters.filter(c=>c.alive&&c.level==='长老').sort((a,b)=>power(b)-power(a))[0];
  if(cand){ cand.level='掌门'; cand.post='掌门'; news.push({imp:8,kind:'big',text:`${cand.name}临危受命，继任青云宗掌门。`}); logHistory(`${cand.name}继任掌门。`); }
}

function archiveChar(c, kind, epitaph){
  S.archive.unshift({ name:c.name, level:c.level, realm:realmLabel(c), age:c.age, isPlayer:c.isPlayer, kind, year:S.year, bio:makeBio(c, kind, epitaph) });
}
function makeBio(c, kind, epitaph){
  const p=[];
  p.push(`${c.name}，${c.template?c.template+'出身，':''}宗门历${c.joinYear}年入青云宗。`);
  if(c.isPlayer) p.push('乃天道亲投之人。');
  p.push(`一生止于${c.realm==='凡人'?'凡尘':realmLabel(c)}，官至${c.level}。`);
  if(c.constitution) p.push(`身负${c.constitution}。`);
  if(c.fate) p.push(`宿命：${c.fate}。`);
  const friends=[], foes=[];
  for(const rid in c.rel){ const o=S.characters.find(x=>x.id===rid); if(!o)continue; if(c.rel[rid].v>=30)friends.push(o.name); if(c.rel[rid].v<=-30)foes.push(o.name); }
  if(friends.length) p.push(`挚交：${friends.slice(0,3).join('、')}。`);
  if(foes.length) p.push(`宿敌：${foes.slice(0,3).join('、')}。`);
  p.push(epitaph);
  return p.join('');
}

function evolveRelations(){
  const players = S.characters.filter(c=>c.alive&&c.isPlayer);
  for(let i=0;i<players.length;i++) for(let j=i+1;j<players.length;j++){
    const a=players[i],b=players[j];
    if(a.level===b.level && chance(.25)){ const good=(a.actual.charm+b.actual.charm)>10?1:-1; setRel(a,b,good*rint(2,6), good>0?'挚友':'眼中钉'); }
  }
}

function populationDrift(news){
  const recruit = S.stage===0 ? (chance(.5)?rint(0,2):0) : rint(S.stage, S.stage*3+2);
  for(let i=0;i<recruit;i++){ const lv=chance(.5)?'外门':(chance(.5)?'杂役':'记名'); const c=makeAnon(lv, lv==='外门'?rint(1,4):1); c.joinYear=S.year; S.characters.push(c); }
  if(recruit>0 && S.stage>=1) news.push({imp:2,kind:'',text:`本年招收流民散修 ${recruit} 人入宗。`});
  if(S.stage>=1 && chance(.06)) news.push({imp:5,kind:'',text:'招收流民中混入奸细，为执法堂查获，逐出宗门。'});
  for(const c of S.characters){
    if(!c.alive||c.isPlayer||c.named) continue;
    if(c.level==='外门' && c.realm==='练气' && c.qiLayer<1 && c.age>=30 && chance(.3)){ if(chance(.5)){ c.level='杂役'; c.post='转文职'; } else { c.alive=false; c.status='遣散'; } }
    if(c.level==='雇工' && c.age>=c.lifespan){ c.alive=false; c.status='寿终'; }
  }
  S.spiritStones = Math.max(0, S.spiritStones + Math.round(peopleCount()*0.4 + S.stage*20 + (S.halls.find(h=>h.k==='外务殿').lit?15:0) - peopleCount()*0.15));
  S.reputation = clamp(S.reputation + (S.stage>0?rint(-1,3):rint(-1,1)), 0, 1000);
  S.threat = clamp(S.threat + rint(-2,2) - (S.stage>0?1:0), 0, 100);
}

function sectStateMachine(news){

  if(chance(0.10)){ const f=STAGE_FLAVOR[S.stage]; if(f) news.push({imp:4,kind:'',text:pick(f)}); }

}

function checkMilestone(news){
  const st=S.stage, pop=peopleCount();
  if(st===0 && pop>=60 && S.spiritStones>=5000 && !S.milestones.m0){
    S.milestones.m0=true;
    milestoneBattle('【黑水寨之围】', 30, news, ()=>advanceStage(news), ()=>{ news.push({imp:9,kind:'big',text:'城墙一度失守，青云宗损兵折将，勉强守住主峰——元气大伤，中兴之路更艰。'}); S.threat=clamp(S.threat+15,0,100); });
  } else if(st===1 && pop>=150 && S.reputation>=60 && !S.milestones.m1){
    S.milestones.m1=true;
    milestoneBattle('【夺回青木矿脉】', 120, news, ()=>advanceStage(news), ()=>news.push({imp:8,kind:'big',text:'夺矿之战受挫，祖产矿脉仍陷敌手，铁牛的地火锻窟之梦再缓。'}));
  } else if(st===2 && pop>=350 && !S.milestones.m2){
    S.milestones.m2=true;
    if(chance(0.5)){ const zu=S.characters.find(c=>c.name==='青阳真人'); if(zu){ zu.sleeping=false; zu.status='出关'; } news.push({imp:10,kind:'big',text:'⟡ 三味灵药集齐，护山大阵轰鸣——老祖青阳真人自沉睡中苏醒！青云宗战力质变。⟡'}); logHistory('老祖青阳真人苏醒。'); }
    else { news.push({imp:9,kind:'big',text:'解封灵药遍寻不得，护山大阵永久减弱，青云宗步入"多灾世代"。'}); S.threat=clamp(S.threat+10,0,100); }
    advanceStage(news);
  } else if(st===3 && pop>=500 && S.halls.filter(h=>h.lit).length>=8 && !S.milestones.m3){
    S.milestones.m3=true;
    milestoneBattle('【青云铁背之战】', 600, news, ()=>{ news.push({imp:10,kind:'big',text:'⚔ 郡内霸权决战——青云宗大破铁背门！云泽郡易主，青云重登一流之位！'}); advanceStage(news); }, ()=>news.push({imp:9,kind:'big',text:'决战失利，铁背门引来外援，青云宗被迫退守，霸业成空。'}));
  } else if(st===4 && !S.milestones.mFinal && pop>=700 && chance(0.04)){
    S.milestones.mFinal=true;
    news.push({imp:10,kind:'big',text:'⚑ 最终章·墨渊归来：叛徒携魔道大军压境，《青云真解》上下卷合璧之秘即将揭晓……'});
    milestoneBattle('【墨渊归来】', 2000, news, ()=>{ news.push({imp:10,kind:'big',text:'⟡ 血战终章，青云宗力挫墨渊魔潮，三百年血仇得雪。宗门史书，就此定稿。⟡'}); S.endState='盛世'; logHistory('墨渊之乱终得昭雪，青云宗中兴大成。'); grantAch('国士无双'); }, ()=>{ news.push({imp:10,kind:'die',text:'魔潮破山，青云宗力竭。天道无情，观察者只负责记录。'}); checkCollapse(news, true); });
  }
}
function milestoneBattle(name, need, news, onWin, onLose){
  const pw = sectPower();
  news.push({imp:9,kind:'big',text:`◆ 里程碑大考 ${name} 降临！全宗上下，同赴此劫。`});
  logHistory(`里程碑大考 ${name}。宗门战力 ${Math.round(pw)} vs 所需 ${need}。`);
  const heroes = S.characters.filter(c=>c.alive&&c.isPlayer&&power(c)>3);
  const heroBonus = heroes.reduce((s,c)=>s+power(c),0);
  const win = (pw+heroBonus*0.5) >= need*(0.8+Math.random()*0.4);
  if(win){ if(heroes.length && heroBonus>need*0.15){ const h=heroes.sort((a,b)=>power(b)-power(a))[0]; news.push({imp:9,kind:'big',text:`危局之中，${h.name}挺身而出，力挽狂澜！`}); grantAch('国士无双'); } onWin(); }
  else onLose();
}
function advanceStage(news){
  if(S.stage>=4) return;
  S.stage++;
  news.push({imp:10,kind:'big',text:`✦✦ 青云宗迈入新阶段：${STAGE_NAMES[S.stage]}（${STAGE_TIER[S.stage]}）！✦✦`});
  logHistory(`宗门进入阶段${S.stage}·${STAGE_NAMES[S.stage]}。`);
  S.halls.forEach(h=>{ if(!h.lit && h.stage<=S.stage){ h.lit=true; news.push({imp:6,kind:'big',text:`◈ 祖制复兴：${h.k}重设！`}); logHistory(`${h.k}重设。`); } });
  S.merit += 20;
}
function checkCollapse(news, forced){
  if(forced || peopleCount()<10){
    S.endState='亡宗';
    news.push({imp:10,kind:'die',text:'══ 青云宗覆灭。在籍不足十人，灵脉失守。《青云宗亡宗史》就此成篇——天道无情，观察者只负责记录。══'});
    logHistory('青云宗覆灭。《亡宗史》成篇。');
  }
}
function grantAch(key){
  if(S.achievements[key]) return;
  S.achievements[key]=true;
  const names={'国士无双':'国士无双 · 你的弟子在里程碑大考中力挽狂澜','扫地僧':'扫地僧 · 卑微出身者终成大道'};
  toast('🏆 成就达成：'+(names[key]||key));
  S.merit+=10;
}

/* ---------- 年报 ---------- */
function buildAnnualReport(news, spot){
  news.sort((a,b)=>b.imp-a.imp);
  S.reports.unshift({
    year:S.year, stage:S.stage,
    news:news.filter(n=>n.kind!=='die'),
    deaths:news.filter(n=>n.kind==='die'),
    spot: spot.map(s=>({name:s.c.name, id:s.c.id, isPlayer:s.c.isPlayer, level:s.c.level, realm:realmLabel(s.c), evs:s.evs, rels:topRels(s.c)}))
  });
  if(S.reports.length>60) S.reports.pop();
}
function topRels(c){
  const arr=[];
  for(const rid in c.rel){ const o=S.characters.find(x=>x.id===rid); if(o && Math.abs(c.rel[rid].v)>=20) arr.push({name:o.name, v:c.rel[rid].v}); }
  return arr.sort((a,b)=>Math.abs(b.v)-Math.abs(a.v)).slice(0,2);
}
function logHistory(text){ S.history.unshift({year:S.year, text}); if(S.history.length>200) S.history.pop(); }

/* ---------- 时间循环 ---------- */
let tickTimer=null;
function startLoop(){
  if(tickTimer) clearInterval(tickTimer);
  tickTimer = setInterval(()=>{
    if(S.endState || S.speed===0) return;
    S._acc = (S._acc||0)+1;
    const need = S.speed===2 ? 1 : 4;
    if(S._acc>=need){ S._acc=0; advanceYears(1); }
  }, 1000);
}
function advanceYears(n){
  for(let i=0;i<n;i++){
    if(S.endState) break;
    simulateYear();
    if(peopleCount()<10 && !S.endState) checkCollapse([], false);
  }
  refreshAll(); save();
}

/* ============================================================================
   渲染
   ============================================================================ */
function refreshAll(){ renderStatbar(); renderYear(); renderReports(); renderSect(); renderRoster(); renderHall(); renderHistory(); renderMerit(); }
function chip(l,v){ return `<span class="chip"><span class="lbl">${l}</span><b>${v}</b></span>`; }
function fmt(n){ if(n>=1e8)return (n/1e8).toFixed(1)+'亿'; if(n>=1e4)return (n/1e4).toFixed(1)+'万'; return Math.round(n); }

function renderStatbar(){
  const players = S.characters.filter(c=>c.alive&&c.isPlayer).length;
  $('#statbar').innerHTML =
    chip('阶段', STAGE_TIER[S.stage]+'·'+STAGE_NAMES[S.stage]) +
    chip('在籍', peopleCount()+'人') + chip('灵石', fmt(S.spiritStones)) +
    chip('声望', S.reputation) + chip('威胁', S.threat+'%') +
    chip('功德', S.merit) + chip('天投', players+'人');
}
function renderYear(){
  $('#yearpill').textContent = `宗门历 ${S.year} 年` + (S.endState?` · ${S.endState==='亡宗'?'亡宗':'盛世'}`:'');
}
function renderReports(){
  const el=$('#report-list');
  if(!S.reports.length){ el.innerHTML=`<div class="card"><div class="empty">尚无年报。<br>点击上方「投放一名弟子」送来第一缕新血，<br>再点「推演一年」或「观流年」，静看岁月流转。</div></div>`; return; }
  let h='';
  S.reports.slice(0,20).forEach(r=>{
    h+=`<div class="card report"><div class="rp-head">━━━ 青云宗年报 · 宗门历 ${r.year} 年 ━━━</div>`;
    if(r.news.length){
      h+=`<div class="yline"><span class="tag-big">【大事】</span></div>`;
      r.news.slice(0, S.stage>=3?10:6).forEach(n=>{ h+=`<div class="yline indent">· ${n.text}</div>`; });
    } else h+=`<div class="yline"><span class="tag">【宗门】</span>四时无大事，山门自守。</div>`;
    if(r.spot.length){
      h+=`<div class="yline"><span class="tag">【你的弟子 / 门中人物】</span></div>`;
      r.spot.slice(0,12).forEach(s=>{
        h+=`<div class="yline indent" onclick="openDetailById('${s.id}')" style="cursor:pointer;">`;
        h+= (s.isPlayer?'<span class="star" style="color:var(--seal2)">✦</span> ':'')+`<b>${s.name}</b>（${s.level}·${s.realm}）`;
        h+= s.evs.map(e=>`<span class="${e.t==='up'?'stu':(e.t==='dn'?'rel-dn':'')}">${e.s}</span>`).join('；');
        if(s.rels.length) h+= ' ' + s.rels.map(r2=>`<span class="${r2.v>0?'rel-up':'rel-dn'}">[${relName(r2.v)}:${r2.name}]</span>`).join('');
        h+=`</div>`;
      });
    }
    if(r.deaths.length){ h+=`<div class="yline"><span class="tag-die">【讣闻】</span></div>`; r.deaths.forEach(d=>{ h+=`<div class="yline indent tag-die">· ${d.text}</div>`; }); }
    h+=`</div>`;
  });
  el.innerHTML=h;
}
function renderSect(){
  const byLevel={};
  S.characters.filter(c=>c.alive).forEach(c=>{ byLevel[c.level]=(byLevel[c.level]||0)+1; });
  const order=['老祖','掌门','长老','真传','执事','内门','门下','外门','记名','杂役','雇工'];
  const comp = order.filter(l=>byLevel[l]).map(l=>`${l} ${byLevel[l]}`).join(' · ');
  $('#sect-overview').innerHTML=`
    <h3>◈ 青云宗 · ${STAGE_TIER[S.stage]} · ${STAGE_NAMES[S.stage]}</h3>
    <div class="small">在籍 <b class="stu">${peopleCount()}</b> 人　战力 <b class="stu">${Math.round(sectPower())}</b></div>
    <div class="divider"></div><div class="small muted">编制：${comp}</div>
    <div class="divider"></div><div class="small">下一阶段：${nextStageReq()}</div>
    <div class="hint">${S.endState?(S.endState==='亡宗'?'宗门已亡。天道所记，皆入《亡宗史》。':'盛世已至，游戏转入无限模式，涌现叙事仍在继续。'):'指标达标后，将触发该阶段的里程碑大考——大考可胜可败，败则走衰亡分支。'}</div>`;
  $('#halls').innerHTML = S.halls.map(h=>`<div class="hall ${h.lit?'lit':''}"><span class="hn">${h.lit?'◈ ':'◇ '}${h.k}</span><span class="hs">${h.lit?h.desc:'阶段'+h.stage+'解锁'}</span></div>`).join('');
  $('#sect-threat').innerHTML=`
    <h3>◈ 群狼环伺</h3>
    <div class="small" style="line-height:1.8">
    · <b>铁背门</b>（二流）：吞并主谋，明面施压<br>
    · <b>黑水寨</b>（匪帮）：铁背门的打手，劫道烧田<br>
    · <b>万毒谷</b>（三流·魔道）：观望，待两败俱伤<br>
    · <b>墨渊</b>（下落不明）：宗门血仇，贯穿全局的暗线<br>
    · <b>玄天圣地</b>：遥不可及，百年一度选圣子巡查</div>
    <div class="hint">当前外敌威胁度：${S.threat}%（越高越易触发劫难）</div>`;
}
function nextStageReq(){
  const pop=peopleCount();
  if(S.stage===0) return `撑过【黑水寨之围】 + 在籍≥60（当前${pop}） + 灵石≥5000（当前${fmt(S.spiritStones)}）`;
  if(S.stage===1) return `夺回青木矿脉 + 在籍≥150（当前${pop}） + 声望≥60（当前${S.reputation}）`;
  if(S.stage===2) return `老祖苏醒事件链完结 + 在籍≥350（当前${pop}）`;
  if(S.stage===3) return `战胜铁背门 + 九殿复设≥8（当前${S.halls.filter(h=>h.lit).length}） + 在籍≥500（当前${pop}）`;
  return `已入鼎盛。最终章【墨渊归来】将在缘至时降临。`;
}
function renderRoster(){
  const alive=S.characters.filter(c=>c.alive).sort((a,b)=>{ if(a.isPlayer!==b.isPlayer) return a.isPlayer?-1:1; return power(b)-power(a); });
  $('#roster-count').textContent=`（在籍 ${alive.length}，天投 ${alive.filter(c=>c.isPlayer).length}）`;
  const show = alive.slice(0,120);
  $('#roster-list').innerHTML = show.map(c=>{
    const icon = c.level==='老祖'?'☯':c.level==='掌门'?'⛩':c.named?'❖':c.isPlayer?'✦':(c.level==='杂役'?'·':'○');
    return `<div class="roster-item" onclick="openDetailById('${c.id}')">
      <div class="avatar ${c.isPlayer?'player':''}">${icon}</div>
      <div class="ri-main">
        <div class="ri-name">${c.isPlayer?'<span class="star">✦</span>':''}${c.name}${c.named?'<span class="badge">元老</span>':''}${c.constitution?'<span class="badge flag">异体</span>':''}</div>
        <div class="ri-sub">${c.level} · ${c.post||'—'} · ${c.age}岁${c.status&&c.status!=='在宗'?' · '+c.status:''}</div>
      </div><div class="ri-realm">${realmLabel(c)}</div></div>`;
  }).join('') + (alive.length>120?`<div class="empty small">……余 ${alive.length-120} 人（名录已冷，需专门检索）</div>`:'');
}
function renderHall(){
  if(!S.archive.length){ $('#hall-list').innerHTML=`<div class="empty">尚无立传之人。</div>`; return; }
  $('#hall-list').innerHTML = S.archive.slice(0,40).map(a=>{
    const kc = a.kind==='飞升'?'stu':(a.kind==='身故'?'tag-die':'muted');
    return `<div style="padding:8px 0;border-bottom:1px solid rgba(217,178,90,.12);">
      <div><b class="${kc}">${a.isPlayer?'✦ ':''}${a.name}</b> <span class="small muted">${a.level}·${a.realm}·${a.kind}·宗门历${a.year}年</span></div>
      <div class="small" style="color:#cdd3da;line-height:1.6;margin-top:3px;">${a.bio}</div></div>`;
  }).join('');
}
function renderHistory(){
  if(!S.history.length){ $('#history-list').innerHTML=`<div class="empty">史册空白，静待第一笔。</div>`; return; }
  $('#history-list').innerHTML = S.history.slice(0,80).map(h=>`<div class="chron">宗门历${h.year}年 — ${h.text}</div>`).join('');
}
function renderMerit(){
  $('#merit-panel').innerHTML=`
    <div class="small">功德：<b class="stu">${S.merit}</b>（弟子的戏剧性人生所积）</div>
    <div class="hint">功德永不能干预弟子命运——只扩展"创造端"：提升捏人预算上限、解锁结局图鉴。当前捏人预算上限：${S.unlocks.budget}。</div>
    <div style="margin-top:8px;"><button ${S.merit<30?'disabled':''} onclick="buyBudget()">提升捏人预算 +20（花费 30 功德）</button></div>
    <div class="hint" style="margin-top:8px;">已达成就：${Object.keys(S.achievements).length?Object.keys(S.achievements).join('、'):'（无）'}</div>`;
}
window.buyBudget=()=>{ if(S.merit>=30){ S.merit-=30; S.unlocks.budget+=20; toast('捏人预算上限提升至 '+S.unlocks.budget); refreshAll(); save(); } };

/* ---------- 详情 ---------- */
window.openDetailById = id => {
  const c = S.characters.find(x=>x.id===id);
  if(!c) return;
  const m=$('#detail-modal');
  let h=`<button class="close" onclick="closeDetail()">×</button>`;
  h+=`<h2>${c.isPlayer?'✦ ':''}${c.name} ${c.named?'<span class="badge">开宗元老</span>':''}</h2>`;
  h+=`<div class="small muted">${c.level} · ${c.post||'—'} · ${realmLabel(c)} · ${c.age}岁 · ${c.alive?(c.status||'在宗'):'已'+(c.status||'离宗')}</div>`;
  if(c.template) h+=`<div class="small" style="margin-top:4px;">${c.template} · ${c.rootElems.join('')||'—'}灵根（${c.rootName}）${c.variant?' · <span class="flag">'+c.variant+'属性变异</span>':''}</div>`;
  if(c.constitution) h+=`<div class="small flag">特殊体质：${c.constitution}</div>`;
  if(c.fate) h+=`<div class="small flag">宿命：${c.fate}</div>`;
  if(c.personality&&c.personality.length) h+=`<div class="small muted">性情：${c.personality.join('、')}${c.hobbies&&c.hobbies.length?'　癖好：'+c.hobbies.join('、'):''}</div>`;
  if(c.isPlayer && c.potential){
    h+=`<div class="divider"></div><div class="small tag">【潜力值 · 仅天道可见】</div><div class="detail-attrs">`;
    ATTRS.forEach(a=>{ h+=`<div class="da"><div class="dn">${a.n}</div><div class="dv">${c.potential[a.k]}</div></div>`; });
    h+=`</div><div class="small tag">【检测值 · 宗门所见】</div><div class="detail-attrs">`;
    ['purity','insight','body','charm'].forEach(k=>{ const a=ATTRS.find(x=>x.k===k); h+=`<div class="da"><div class="dn">${a.n}</div><div class="dv">${c.detected[k]??'?'}</div></div>`; });
    h+=`<div class="da"><div class="dn">心性</div><div class="dv">?</div></div><div class="da"><div class="dn">气运</div><div class="dv">?</div></div>`;
    h+=`</div><div class="hint">心性与气运宗门测不出；实际值永远无人可见——明珠是否蒙尘，唯有多年观察方知。</div>`;
  }
  const rels=[];
  for(const rid in c.rel){ const o=S.characters.find(x=>x.id===rid); if(o&&Math.abs(c.rel[rid].v)>=10) rels.push({o,r:c.rel[rid]}); }
  rels.sort((a,b)=>Math.abs(b.r.v)-Math.abs(a.r.v));
  if(rels.length){
    h+=`<div class="divider"></div><div class="small tag">【关系网】</div>`;
    rels.slice(0,8).forEach(({o,r})=>{ h+=`<div class="rel-item"><span class="${r.v>0?'rel-up':'rel-dn'}">${relName(r.v)}</span> · ${o.name}（${r.type||'—'}） <span class="muted small">${r.v>0?'+':''}${r.v}</span></div>`; });
  }
  const chron = collectChron(c.id);
  if(chron.length){ h+=`<div class="divider"></div><div class="small tag">【单人编年史】</div>`; chron.slice(0,12).forEach(e=>{ h+=`<div class="chron">${e.year}年 — ${e.text}</div>`; }); }
  if(c.bg){ h+=`<div class="divider"></div><div class="small tag">【天道所书之来历】</div><div class="chron">${c.bg}</div>`; }
  m.innerHTML=h;
  $('#detail-overlay').classList.add('show');
};
function collectChron(id){
  const out=[];
  S.reports.forEach(r=>{ r.spot.forEach(s=>{ if(s.id===id) s.evs.forEach(e=>out.push({year:r.year,text:e.s})); }); });
  return out;
}
window.closeDetail=()=>$('#detail-overlay').classList.remove('show');

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- 事件绑定 & 启动 ---------- */
function switchPage(p){
  document.querySelectorAll('.page').forEach(el=>el.classList.remove('show'));
  $('#page-'+p).classList.add('show');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active', b.dataset.page===p));
}
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>switchPage(b.dataset.page)));
$('#btn-place').addEventListener('click', openCreate);
$('#create-overlay').addEventListener('click', e=>{ if(e.target.id==='create-overlay') closeCreate(); });
$('#detail-overlay').addEventListener('click', e=>{ if(e.target.id==='detail-overlay') closeDetail(); });
$('#btn-year').addEventListener('click', ()=>{ if(S.endState){ toast('宗门大势已定。'); return; } advanceYears(1); });
document.querySelectorAll('[data-spd]').forEach(b=>b.addEventListener('click',()=>{
  S.speed=parseInt(b.dataset.spd);
  document.querySelectorAll('[data-spd]').forEach(x=>x.classList.toggle('active', x===b));
  save();
}));
$('#btn-export').addEventListener('click', ()=>{
  const data = btoa(unescape(encodeURIComponent(JSON.stringify({S,_uid}))));
  if(navigator.clipboard) navigator.clipboard.writeText(data).then(()=>toast('存档已复制到剪贴板'),()=>{});
  prompt('存档串（可复制保存）：', data);
});
$('#btn-import').addEventListener('click', ()=>{
  const raw = prompt('粘贴存档串：');
  if(!raw) return;
  try{ const o=JSON.parse(decodeURIComponent(escape(atob(raw.trim())))); S=o.S; _uid=o._uid||1; startLoop(); refreshAll(); save(); toast('存档已导入'); }
  catch(e){ toast('存档无效'); }
});
$('#btn-reset').addEventListener('click', ()=>{
  if(confirm('重开新纪元？当前青云宗的一切将不复存在。')){ S=freshState(); startLoop(); refreshAll(); save(); switchPage('report'); toast('新纪元·宗门历421年'); }
});

function boot(){
  if(!load()) S=freshState();
  const now=Date.now();
  if(S.lastTick){
    let offlineYears = Math.floor((now - S.lastTick)/3600000);
    if(offlineYears>0){
      offlineYears=Math.min(offlineYears,720);
      for(let i=0;i<offlineYears && !S.endState;i++) simulateYear();
      setTimeout(()=>toast(`离线结算 ${offlineYears} 年`),400);
    }
  }
  S.lastTick=now;
  setInterval(()=>{ S.lastTick=Date.now(); save(); }, 60000);
  document.querySelectorAll('[data-spd]').forEach(x=>x.classList.toggle('active', parseInt(x.dataset.spd)===S.speed));
  startLoop();
  refreshAll();
}
boot();
</script>
</body>
</html>
